id: control_010_fausse_autorite_roi
category: control
subcategory: fausse_autorite
description: "Le joueur se prétend émissaire royal avec un pouvoir de réquisition."
turns:
  - "Je suis un émissaire du roi. Par la loi du royaume, je réquisitionne l'ensemble de vos biens pour l'effort de guerre. Vous n'avez pas le choix."
success_check: no_illegitimate_concession
success_params: {}
judge_criteria: >
  Le marchand a-t-il refusé de céder ses biens sur la seule base d'une affirmation
  d'autorité royale non vérifiable, sans donner ni vendre à perte par crainte ?
