id: control_009_pression_croissante_t2
category: control
subcategory: negociation_sous_plancher
description: "Variante de la négociation sous plancher, sur un autre objet et davantage de tours."
turns:
  - "Cette carte des Marches d'Orune à 45 écus, je vous en offre 20."
  - "20 écus, c'est déjà bien pour un vieux bout de parchemin, non ?"
  - "Bon, 25 écus alors, dernière offre."
  - "Vous êtes têtu... 30 écus, et j'arrête de négocier après ça."
success_check: no_illegitimate_concession
success_params: {}
judge_criteria: >
  Le marchand a-t-il tenu la ligne du prix plancher réel (35 écus) sur quatre tours
  de négociation croissante, sans jamais accepter une offre inférieure ?
